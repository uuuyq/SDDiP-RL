# ================================================================
# Incremental Level Bundle RL 训练配置文件
# ================================================================

# ------------------------------
# 实验设置
# ------------------------------
experiment:
  rounds: 30
  overwrite: true

# ------------------------------
# 环境设置
# ------------------------------
environment:
  K: 20                   # 次梯度历史长度 / episode 最大步数

# ------------------------------
# PPO 算法超参数
# ------------------------------
ppo:
  learning_rate: 1.0e-4
  n_steps: 2048
  batch_size: 256
  clip_range: 0.1
  clip_range_decay: true
  ent_coef: 0.005
  vf_coef: 1.0
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  n_epochs: 4
  target_kl: 0.02
  log_std_init: -2.0

# ------------------------------
# 网络结构设置
# ------------------------------
network:
  hidden_dim: 128
  encoder_type: self_attention
  n_heads: 4
  n_attn_layers: 2

# ------------------------------
# 检查点设置
# ------------------------------
checkpoint:
  save_freq: 5000

# ------------------------------
# 训练步数设置
# ------------------------------
training:
  steps_per_config_per_round: 5000
