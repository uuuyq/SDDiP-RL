# ================================================================
# Level Bundle RL 训练配置文件
# ================================================================

# ------------------------------
# 实验设置
# ------------------------------
experiment:
  rounds: 15
  overwrite: true

# ------------------------------
# 环境设置
# ------------------------------
environment:
  K: 20                   # 次梯度历史长度 / episode 最大步数

# ------------------------------
# PPO 算法超参数
# ------------------------------
# 基于 exp_11 (self_attention) 结果调优：
# ev=0.90 很好，但 KL/clip 太高 → 收紧 clip + 降低 lr + 收紧 target_kl
ppo:
  learning_rate: 1.0e-4   # 从 3e-4 降到 1e-4，减缓策略更新速度
  n_steps: 2048           # 增大采样量，约 100 个完整 episode
  batch_size: 256         # 减小 batch 增加更新频率
  clip_range: 0.1         # 从 0.2 收紧到 0.1，限制策略更新幅度
  clip_range_decay: true
  ent_coef: 0.005         # 适度熵系数
  vf_coef: 1.0            # ev 已经很好，恢复 vf_coef 让 critic 继续改善
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  n_epochs: 4             # 从 10 减到 4，减少每 batch 的 KL 累积
  target_kl: 0.02         # 从 0.05 收紧到 0.02，更早触发 early stop
  log_std_init: -2.0      # tanh 前高斯 std≈0.135

# ------------------------------
# 网络结构设置
# ------------------------------
network:
  hidden_dim: 128         # 编码器隐藏层维度
  encoder_type: self_attention # "deepset", "cross_attention" 或 "self_attention"
  n_heads: 4              # attention 头数（仅 attention 模式）
  n_attn_layers: 2        # attention 层数（仅 attention 模式）

# ------------------------------
# 检查点设置
# ------------------------------
checkpoint:
  save_freq: 5000

# ------------------------------
# 训练步数设置
# ------------------------------
training:
  steps_per_config_per_round: 5000
