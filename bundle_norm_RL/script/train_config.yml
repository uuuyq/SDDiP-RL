# ================================================================
# Level Bundle RL 训练配置文件
# ================================================================

# ------------------------------
# 实验设置
# ------------------------------
experiment:
  rounds: 15
  overwrite: false

# ------------------------------
# 环境设置
# ------------------------------
environment:
  K: 20                   # 次梯度历史长度 / episode 最大步数

# ------------------------------
# PPO 算法超参数
# ------------------------------
ppo:
  learning_rate: 3.0e-5
  n_steps: 500
  batch_size: 128
  clip_range: 0.2
  clip_range_decay: false
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  gamma: 0.95
  gae_lambda: 0.95
  n_epochs: 10
  target_kl: 0.05

# ------------------------------
# 网络结构设置
# ------------------------------
network:
  hidden_dim: 64          # 编码器隐藏层维度

# ------------------------------
# 检查点设置
# ------------------------------
checkpoint:
  save_freq: 5000

# ------------------------------
# 训练步数设置
# ------------------------------
training:
  steps_per_config_per_round: 5000
