
# ================================================================
# Bundle ML 模型配置文件
# ================================================================

# ------------------------------
# 输入输出维度配置
# ------------------------------
# 注意：具体维度值根据实际训练数据自动确定，这里保留默认值
dimensions:
  # λ (dual variable) 的维度
  # 实际数据中 lambda_dim = 13
  lambda_dim: 13

  # x_prev (上一阶段状态，对应 trial_point: x, y, x_bs, soc)
  # trial_point = X_TRIAL + Y_TRIAL + X_BS_TRIAL(展开) + SOC_TRIAL
  # 实际数据中 x_prev_dim = 10 (3 + 3 + 6 + 1)
  x_prev_dim: 10

  # realization 特征维度
  # p_d (demand) + re (renewable generation)
  # 实际数据中 realization_dim = 12 (6 + 6)
  realization_dim: 12

  # Cut 特征维度
  # 每个 cut 包含: g_i (subgradient) + phi_i (intercept)
  # 注意：当前收集的数据中 lag_cuts 为空，需要后续迭代数据
  cut_dim: 14  # g_i (13) + phi_i (1)

  # 输出维度
  # 预测 subgradient 和 opt_value
  output_dim: 13  # 对应 subgradient 维度

# ------------------------------
# 网络结构设置
# ------------------------------
network:
  # Cut Encoder
  cut_encoder_hidden_dim: 64

  # Attention
  attention_hidden_dim: 64
  num_heads: 4
  num_layers: 1
  ffn_dim: 128
  dropout: 0.1

  # Global Encoder
  global_encoder_hidden_dim: 64

  # Prediction Heads
  prediction_head_hidden_dim: 128

  # Bundle Embedding 维度
  bundle_embedding_dim: 64

  # Shared Feature 维度 (bundle_embedding_dim + global_embedding_dim)
  shared_feature_dim: 128

# ------------------------------
# 数据相关设置
# ------------------------------
data:
  max_cuts: 50  # 最大 cuts 数量

# ------------------------------
# 训练设置
# ------------------------------
training:
  learning_rate: 1.0e-4
  batch_size: 64
  num_epochs: 100
  loss_weights:
    regression: 1.0
    feasibility: 0.1

# ------------------------------
# 模型集成设置
# ------------------------------
integration:
  mode: "subproblem"  # "subproblem" (完全替代) or "warm_start" (提供初始值)
