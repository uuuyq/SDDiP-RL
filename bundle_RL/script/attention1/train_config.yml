# ================================================================
# Bundle Method RL 训练配置文件（attention1 简化版）
# ================================================================

# ------------------------------
# 实验设置
# ------------------------------
experiment:
  rounds: 15             # 训练轮数（每个 config 累计 15×5000=75k 步）
  overwrite: false       # 是否覆盖已有模型重新训练

# ------------------------------
# 环境设置
# ------------------------------
environment:
  K: 10                  # 最大 cuts 数量

# ------------------------------
# PPO 算法超参数
# ------------------------------
ppo:
  learning_rate: 3.0e-5  # 学习率（平衡：5e-6太慢无学习，1e-4太快 KL 爆炸）
  n_steps: 500           # 每次更新采集的步数
  batch_size: 128        # 批大小
  clip_range: 0.2        # PPO clip 范围（标准默认值；0.1 太窄导致 clip_fraction 偏高）
  clip_range_decay: false # 是否启用 clip_range 线性衰减
  ent_coef: 0.005        # 熵系数（从 0.05 下调拑制 log_std 暴涨，止住 KL 飙升）
  vf_coef: 0.5           # 价值函数系数（1.0→ 0.5：降低以避免 V(s) 过度专注当前 config，减少切换时的 EV 崩溃）
  max_grad_norm: 0.5     # 最大梯度范数
  gamma: 0.95            # 折扣因子（episode 仅 10 步，0.99 太接近 1 使 V(s) 几乎等于总回报，降为 0.95 让 bootstrap 更局部）
  gae_lambda: 0.95       # GAE 参数
  n_epochs: 10           # 训练轮数
  target_kl: 0.05        # KL 散度目标（放宽到 0.05，避免初期 V(s)差时频繁 early stop 卡死学习）

# ------------------------------
# 网络结构设置
# ------------------------------
# 注意：相对 attention/ 模块，此处不含 features_dim / actor_net_arch /
# critic_net_arch / share_encoder。head 内部维度全部由 hidden_dim 决定，
# Actor/Critic 始终共享 encoder。
network:
  hidden_dim: 64         # 编码器隐藏层维度（同时决定 LambdaHead/EtaHead/ValueHead 内部维度）
  num_heads: 2           # Attention 头数
  num_layers: 1          # Attention 层数
  ffn_dim: 128           # FFN 维度
  dropout: 0.0           # Dropout 概率（0.1 → 0.0：避免 rollout(eval)与update(train) 下输出不一致引入虚假 KL）

# ------------------------------
# 检查点设置
# ------------------------------
checkpoint:
  save_freq: 5000        # 检查点保存频率（步数）

# ------------------------------
# 训练步数设置
# ------------------------------
training:
  steps_per_config_per_round: 5000  # 每轮每个 config 训练的步数（=10次 PPO update，足够适应当前 env）
  max_timesteps_per_env: -1         # 单个环境最大训练步数（-1表示不限制）
